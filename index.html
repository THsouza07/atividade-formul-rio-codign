<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Seguro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Criar Conta</h1>
    <form id="form-cadastro" novalidate>
      <div class="campo-grupo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Mínimo 3 letras">
        <span class="erro" id="erro-nome"></span>
      </div>

      <div class="campo-grupo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com">
        <span class="erro" id="erro-email"></span>
      </div>

      <div class="campo-grupo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres">
        <span class="erro" id="erro-senha"></span>
      </div>

      <div class="campo-grupo">
        <label for="confirmar-senha">Confirmação de Senha</label>
        <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Repita a senha">
        <span class="erro" id="erro-confirmar"></span>
      </div>

      <button type="submit">Cadastrar</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
